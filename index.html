<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Wrand.cc — R&D Domain Graph</title>
        <meta
            name="description"
            content="Interactive graph of the Wrand.cc R&D portfolio — 25 domains mapped as a navigable network."
        />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #08090c;
                --bg2: #0e1015;
                --surface: #13151c;
                --surface-hover: #1a1d28;
                --border: #1e2130;
                --border-bright: #2a2e44;
                --text: #d4d7e5;
                --text-dim: #6b7094;
                --text-muted: #3d4160;
                --cyan: #00d9ff;
                --green: #00e87b;
                --purple: #8b5cf6;
                --pink: #f472b6;
                --orange: #fb923c;
                --gold: #fbbf24;
                --red: #ef4444;
                --hub: #e8ecff;
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
                background: var(--bg);
                color: var(--text);
                font-family: "IBM Plex Mono", monospace;
            }

            /* ── CANVAS ── */
            #graph-canvas {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 1;
                /* purely decorative — never intercept a click meant for a card */
                pointer-events: none;
            }

            /* The container carries the auto-fit transform, and a transform
               creates a stacking context — which would otherwise paint the whole
               card layer at z-index 0, i.e. UNDER the edge canvas. It must be
               positioned and stacked explicitly. It spans the viewport, so it
               stays transparent to the pointer and the cards opt back in. */
            #card-container {
                position: fixed;
                inset: 0;
                z-index: 50;
                pointer-events: none;
            }

            /* ── HEADER ── */
            .hud-top {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 100;
                height: 50px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 1.5rem;
                background: rgba(8, 9, 12, 0.85);
                backdrop-filter: blur(16px);
                border-bottom: 1px solid var(--border);
            }
            .hud-logo {
                font-family: "Instrument Serif", serif;
                font-size: 1.4rem;
                font-style: italic;
                color: var(--text);
                letter-spacing: -0.02em;
            }
            .hud-logo em {
                color: var(--cyan);
                font-style: italic;
            }
            .hud-stats {
                display: flex;
                gap: 1.5rem;
                align-items: center;
            }
            .hud-stat {
                display: flex;
                align-items: baseline;
                gap: 0.35rem;
                font-size: 0.7rem;
            }
            .hud-stat b {
                color: var(--cyan);
                font-size: 0.85rem;
                font-weight: 600;
            }
            .hud-stat span {
                color: var(--text-dim);
                text-transform: uppercase;
                letter-spacing: 0.08em;
                font-size: 0.6rem;
            }
            .hud-amp {
                text-decoration: none;
                color: var(--gold);
                font-size: 1.1rem;
                font-weight: 700;
                padding: 0.3rem 0.6rem;
                border-radius: 6px;
                border: 1px solid transparent;
                transition: all 0.2s;
            }
            .hud-amp:hover {
                border-color: rgba(251, 191, 36, 0.4);
                background: rgba(251, 191, 36, 0.06);
            }

            /* ── FILTER BAR ── */
            .filter-bar {
                position: fixed;
                bottom: 1.2rem;
                left: 50%;
                transform: translateX(-50%);
                z-index: 100;
                display: flex;
                gap: 0.4rem;
                padding: 0.4rem;
                background: rgba(14, 16, 21, 0.9);
                backdrop-filter: blur(16px);
                border: 1px solid var(--border);
                border-radius: 10px;
            }
            .filter-btn {
                font-family: "IBM Plex Mono", monospace;
                font-size: 0.65rem;
                font-weight: 500;
                padding: 0.4rem 0.8rem;
                border: none;
                border-radius: 6px;
                background: transparent;
                color: var(--text-dim);
                cursor: pointer;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                transition: all 0.2s;
                white-space: nowrap;
            }
            .filter-btn:hover {
                color: var(--text);
                background: var(--surface);
            }
            .filter-btn.active {
                color: var(--cyan);
                background: rgba(0, 217, 255, 0.1);
            }

            /* ── NODE CARDS ── */
            .node-card {
                position: absolute;
                pointer-events: auto;
                z-index: 50;
                width: 220px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                overflow: hidden;
                cursor: grab;
                transition:
                    box-shadow 0.3s,
                    border-color 0.3s,
                    opacity 0.3s;
                user-select: none;
                opacity: 0;
                animation: nodeAppear 0.5s ease forwards;
            }
            .node-card:active {
                cursor: grabbing;
                z-index: 60;
            }
            .node-card:hover {
                border-color: var(--border-bright);
                box-shadow:
                    0 8px 40px rgba(0, 0, 0, 0.5),
                    0 0 20px rgba(0, 217, 255, 0.06);
            }
            .node-card.dimmed {
                opacity: 0.12 !important;
                /* still clickable: hovering a dimmed card re-centres the
                   highlight on it, so the graph stays explorable while a
                   selection is held. */
            }
            .node-card.selected {
                border-color: var(--cyan);
                box-shadow: 0 0 0 1px var(--cyan), 0 10px 44px rgba(0, 0, 0, 0.6);
            }
            @keyframes nodeAppear {
                from {
                    opacity: 0;
                    transform: scale(0.85);
                }
                to {
                    opacity: 1;
                    transform: scale(1);
                }
            }

            /* browser chrome */
            .card-chrome {
                display: flex;
                align-items: center;
                gap: 0.35rem;
                padding: 0.4rem 0.6rem;
                background: var(--bg2);
                border-bottom: 1px solid var(--border);
            }
            .chrome-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
            }
            .chrome-dot.r {
                background: #ef4444;
            }
            .chrome-dot.y {
                background: #fbbf24;
            }
            .chrome-dot.g {
                background: #22c55e;
            }
            .chrome-url {
                flex: 1;
                margin-left: 0.4rem;
                font-size: 0.55rem;
                color: var(--text-dim);
                background: var(--bg);
                padding: 0.2rem 0.5rem;
                border-radius: 4px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                letter-spacing: 0.02em;
            }
            /* card body */
            .card-body {
                padding: 0.8rem;
            }
            .card-name {
                font-family: "Instrument Serif", serif;
                font-size: 1rem;
                font-weight: 400;
                font-style: italic;
                margin-bottom: 0.25rem;
                color: var(--text);
            }
            .card-tagline {
                font-size: 0.65rem;
                color: var(--text-dim);
                line-height: 1.45;
                margin-bottom: 0.5rem;
            }
            .card-tags {
                display: flex;
                flex-wrap: wrap;
                gap: 0.25rem;
            }
            .card-tag {
                font-size: 0.5rem;
                padding: 0.15rem 0.4rem;
                border-radius: 3px;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                font-weight: 600;
            }

            /* tag colors by category */
            .tag-hub {
                background: rgba(232, 236, 255, 0.14);
                color: var(--hub);
            }
            .tag-infra {
                background: rgba(0, 217, 255, 0.12);
                color: var(--cyan);
            }
            .tag-agent {
                background: rgba(0, 232, 123, 0.12);
                color: var(--green);
            }
            .tag-creative {
                background: rgba(244, 114, 182, 0.12);
                color: var(--pink);
            }
            .tag-lang {
                background: rgba(139, 92, 246, 0.12);
                color: var(--purple);
            }
            .tag-data {
                background: rgba(251, 191, 36, 0.12);
                color: var(--gold);
            }
            .tag-brand {
                background: rgba(251, 146, 60, 0.12);
                color: var(--orange);
            }
            .tag-observe {
                background: rgba(239, 68, 68, 0.12);
                color: var(--red);
            }

            /* card-link overlay */
            .card-visit {
                display: block;
                text-align: center;
                padding: 0.4rem;
                font-size: 0.55rem;
                color: var(--text-muted);
                text-decoration: none;
                border-top: 1px solid var(--border);
                transition: all 0.2s;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }
            .card-visit:hover {
                color: var(--cyan);
                background: rgba(0, 217, 255, 0.04);
            }

            /* ── DETAIL PANEL ── */
            .detail {
                position: fixed;
                top: 50px;
                right: 0;
                bottom: 0;
                z-index: 110;
                width: 340px;
                padding: 1.1rem 1.2rem 6rem;
                overflow-y: auto;
                overscroll-behavior: contain;
                background: rgba(14, 16, 21, 0.96);
                backdrop-filter: blur(18px);
                border-left: 1px solid var(--border-bright);
            }
            .detail[hidden] {
                display: none;
            }
            .detail-close {
                position: absolute;
                top: 0.6rem;
                right: 0.8rem;
                width: 26px;
                height: 26px;
                border: none;
                border-radius: 6px;
                background: transparent;
                color: var(--text-dim);
                font-size: 1.1rem;
                line-height: 1;
                cursor: pointer;
            }
            .detail-close:hover {
                background: var(--surface);
                color: var(--text);
            }
            .detail-url {
                font-size: 0.55rem;
                color: var(--text-dim);
                letter-spacing: 0.04em;
            }
            .detail-name {
                font-family: "Instrument Serif", serif;
                font-style: italic;
                font-size: 1.35rem;
                margin: 0.15rem 0 0.4rem;
            }
            .detail-tagline {
                font-size: 0.66rem;
                line-height: 1.5;
                color: var(--text-dim);
            }
            .detail-visit {
                display: inline-block;
                margin-top: 0.6rem;
                font-size: 0.55rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--text-muted);
                text-decoration: none;
            }
            .detail-visit:hover {
                color: var(--cyan);
            }
            .detail-count {
                margin: 1.2rem 0 0.5rem;
                padding-top: 0.9rem;
                border-top: 1px solid var(--border);
                font-size: 0.58rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: var(--text-dim);
            }
            /* one connection */
            .nb {
                display: block;
                width: 100%;
                text-align: left;
                margin-bottom: 0.3rem;
                padding: 0.5rem 0.55rem;
                border: 1px solid transparent;
                border-radius: 6px;
                background: transparent;
                color: inherit;
                font-family: inherit;
                cursor: pointer;
                transition: all 0.15s;
            }
            .nb:hover {
                background: var(--surface);
                border-color: var(--border-bright);
            }
            .nb-top {
                display: flex;
                align-items: center;
                gap: 0.4rem;
            }
            .nb-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                flex: none;
            }
            .nb-name {
                font-size: 0.68rem;
                color: var(--text);
            }
            .nb-dir {
                margin-left: auto;
                font-size: 0.6rem;
                color: var(--text-muted);
            }
            /* evidence tier — the honest half of a connection */
            .nb-tier {
                display: inline-block;
                margin: 0.3rem 0 0 1.1rem;
                padding: 0.1rem 0.35rem;
                border-radius: 3px;
                font-size: 0.47rem;
                letter-spacing: 0.09em;
                text-transform: uppercase;
                font-weight: 600;
            }
            .t-code {
                background: rgba(0, 232, 123, 0.14);
                color: var(--green);
            }
            .t-spec {
                background: rgba(0, 217, 255, 0.12);
                color: var(--cyan);
            }
            .t-intent {
                background: rgba(251, 146, 60, 0.12);
                color: var(--orange);
            }
            .t-owns {
                background: rgba(107, 112, 148, 0.16);
                color: var(--text-dim);
            }
            .nb-why {
                display: block;
                margin: 0.25rem 0 0.35rem 1.1rem;
                font-size: 0.58rem;
                line-height: 1.45;
                color: var(--text-dim);
            }
            .nb-bar {
                height: 2px;
                margin-left: 1.1rem;
                border-radius: 2px;
                background: var(--border);
            }
            .nb-bar i {
                display: block;
                height: 100%;
                border-radius: 2px;
            }

            /* ── MINIMAP ── */
            .minimap {
                position: fixed;
                bottom: 4rem;
                right: 1.2rem;
                z-index: 90;
                width: 140px;
                height: 100px;
                background: rgba(14, 16, 21, 0.85);
                backdrop-filter: blur(10px);
                border: 1px solid var(--border);
                border-radius: 6px;
                overflow: hidden;
            }
            .minimap canvas {
                width: 100%;
                height: 100%;
            }

            /* ── RESPONSIVE ── */
            @media (max-width: 768px) {
                .hud-stats {
                    display: none;
                }
                .filter-bar {
                    bottom: 0.8rem;
                    overflow-x: auto;
                    max-width: 95vw;
                }
                .filter-bar::-webkit-scrollbar {
                    display: none;
                }
                .node-card {
                    width: 170px;
                }
                .card-name {
                    font-size: 0.9rem;
                }
                .minimap {
                    display: none;
                }
                .detail {
                    top: auto;
                    left: 0;
                    right: 0;
                    width: auto;
                    max-height: 52vh;
                    border-left: none;
                    border-top: 1px solid var(--border-bright);
                    padding-bottom: 4.5rem;
                }
            }
        </style>
    </head>
    <body>
        <!-- HUD -->
        <div class="hud-top">
            <div class="hud-logo"><em>Wrand</em>.cc</div>
            <div class="hud-stats">
                <div class="hud-stat">
                    <b id="totalDomains">0</b><span>domains</span>
                </div>
                <div class="hud-stat">
                    <b id="totalEdges">0</b><span>connections</span>
                </div>
            </div>
            <a
                class="hud-amp"
                href="https://ampersandboxdesign.com"
                target="_blank"
                rel="noopener"
                >[&]</a

        <!-- FILTER -->
        <div class="filter-bar">
            <button class="filter-btn active" id="filterAll" data-filter="all">
                All
            </button>
            <button class="filter-btn" data-filter="hub">Hubs</button>
            <button class="filter-btn" data-filter="agent">Agent Stack</button>

            <button class="filter-btn" data-filter="creative">Products</button>
            <button class="filter-btn" data-filter="brand">Identity</button>
        </div>

        <!-- DETAIL PANEL — click a node to inspect its connections -->
        <aside class="detail" id="detail" hidden>
            <button class="detail-close" id="detailClose" aria-label="Close">
                ×
            </button>
            <div class="detail-url" id="dUrl"></div>
            <div class="detail-name" id="dName"></div>
            <div class="detail-tagline" id="dTagline"></div>
            <a class="detail-visit" id="dVisit" target="_blank" rel="noopener"
                >Visit site →</a
            >
            <div class="detail-count" id="dCount"></div>
            <div id="dList"></div>
        </aside>

        <!-- MINIMAP -->
        <div class="minimap"><canvas id="minimap-canvas"></canvas></div>

        <!-- CANVAS for edges -->
        <canvas id="graph-canvas"></canvas>

        <!-- cards injected by JS -->
        <div id="card-container"></div>

            // ═══════════════════════════════════════════
            // SETUP
            // ═══════════════════════════════════════════
            const canvas = document.getElementById("graph-canvas");
            const ctx = canvas.getContext("2d");
            const container = document.getElementById("card-container");
            let W, H;

            // ── VIEW ──────────────────────────────────────────────────────
            // The cards do not fit a phone, and 25 of them do not fit a 1280px
            // laptop either: ~1.06M px² of card against ~890k px² of usable
            // viewport. So the simulation runs in its OWN world, sized to hold
            // every card comfortably, and the whole thing is scaled down to fit
            // the screen. Nothing is ever pushed off-canvas or buried.
            const VIEW = { s: 1, top: 50, bottom: 0, worldW: 0, worldH: 0 };

            function bottomInset() {
                const fb = document.querySelector(".filter-bar");
                return fb ? H - fb.getBoundingClientRect().top + 12 : 60;
            }

            function fit() {
                VIEW.top = 50;
                VIEW.bottom = bottomInset();
                // The open detail panel is not drawable area. It docks right on
                // desktop and along the bottom on narrow screens, so subtract
                // from whichever axis it actually occupies.
                const d = document.getElementById("detail");
                let panelW = 0,
                    panelH = 0;
                if (d && !d.hidden) {
                    const r = d.getBoundingClientRect();
                    if (r.width < W * 0.6) panelW = r.width;
                    else panelH = r.height;
                }
                const availW = W - panelW;
                const availH = Math.max(
                    200,
                    H - VIEW.top - VIEW.bottom - panelH,
                );
                // Cards need roughly 2.4x their own area to look like a graph
                // rather than a mosaic; that factor is what buys the whitespace
                // the edges are drawn in.
                const need =
                    nodes.reduce(
                        (t, n) => t + (n.hidden ? 0 : n.w * n.h),
                        0,
                    ) * 2.4;
                const s = Math.min(1, Math.sqrt((availW * availH) / need));
                const prevW = VIEW.worldW,
                    prevH = VIEW.worldH;
                VIEW.s = Math.max(0.3, s);
                VIEW.worldW = availW / VIEW.s;
                VIEW.worldH = availH / VIEW.s;
                // The world just changed size; carry the nodes with it. Without
                // this, filtering shrinks the world and leaves cards stranded
                // outside it until the clamp drags them back over many frames.
                if (prevW > 0 && prevH > 0) {
                    const rx = VIEW.worldW / prevW,
                        ry = VIEW.worldH / prevH;
                    nodes.forEach((n) => {
                        n.x *= rx;
                        n.y *= ry;
                    });
                }
                if (typeof alpha === "number") reheat(0.5);
                container.style.transformOrigin = "0 0";
                container.style.transform =
                    "translate(0," + VIEW.top + "px) scale(" + VIEW.s + ")";
            }

            // `fit()` reads `nodes`, which is created further down — so the very
            // first resize() only sizes the canvas, and layout starts once the
            // cards exist and have been measured.
            let laidOut = false;
            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                if (laidOut) fit();
            }
            resize();
            window.addEventListener("resize", resize);

            // screen px → world px (drag handlers work in world coordinates)
            const toWorldX = (px) => px / VIEW.s;
            const toWorldY = (py) => (py - VIEW.top) / VIEW.s;

            const catColors = {
                hub: "#e8ecff",
                brand: "#fb923c",
                agent: "#00e87b",
                infra: "#00d9ff",
                lang: "#8b5cf6",
                creative: "#f472b6",
                data: "#fbbf24",
                observe: "#ef4444",
            };

            // Create nodes with physics
            const nodes = domains.map((d, i) => {
                const angle = (i / domains.length) * Math.PI * 2;
                const radius = Math.min(W, H) * 0.3;
                return {
                    ...d,
                    hidden: false,
                    x:
                        W / 2 +
                        Math.cos(angle) * radius +
                        (Math.random() - 0.5) * 100,
                    y:
                        H / 2 +
                        40 +
                        Math.sin(angle) * radius +
                        (Math.random() - 0.5) * 100,
                    vx: 0,
                    vy: 0,
                    fx: 0,
                    fy: 0,
                    w: 220,
                    h: 180,
                    pinned: false,
                    el: null,
                };
            });
            const nodeMap = {};
            nodes.forEach((n) => (nodeMap[n.id] = n));

            // Stats — derived, so the counts can never drift from the data
            document.getElementById("totalDomains").textContent =
                domains.length;
            document.getElementById("totalEdges").textContent = edges.length;
            document.getElementById("filterAll").textContent =
                "All " + domains.length;

            // ── Create DOM cards ──
            nodes.forEach((node, i) => {
                const card = document.createElement("div");
                card.className = "node-card";
                card.dataset.id = node.id;
                card.dataset.cat = node.cat;
                card.style.animationDelay = i * 0.04 + "s";
                const col = catColors[node.cat];
                card.innerHTML = `
    <div class="card-chrome">
      <div class="chrome-dot r"></div>
      <div class="chrome-dot y"></div>
      <div class="chrome-dot g"></div>
      <div class="chrome-url">${node.name}</div>

    <div class="card-body">
      <div class="card-name">${node.label}</div>
      <div class="card-tagline">${node.tagline}</div>
      <div class="card-tags">
        ${node.tags.map((t) => `<span class="card-tag tag-${t}">${t}</span>`).join("")}
      </div>
    </div>
    <a class="card-visit" href="${node.url}" target="_blank" rel="noopener">Visit Site →</a>
  `;
                card.style.borderTop = `2px solid ${col}`;
                container.appendChild(card);
                node.el = card;

                // Drag
                let dragging = false,
                    ox,
                    oy,
                    downX = 0,
                    downY = 0,
                    travelled = 0;
                const onDown = (e) => {
                    if (e.target.closest(".card-visit")) return;
                    dragging = true;
                    node.pinned = true;
                    const pt = e.touches ? e.touches[0] : e;
                    ox = toWorldX(pt.clientX) - node.x;
                    oy = toWorldY(pt.clientY) - node.y;
                    downX = pt.clientX;
                    downY = pt.clientY;
                    travelled = 0;
                    card.style.zIndex = 60;
                    reheat(0.5);
                    e.preventDefault();
                };
                const onMove = (e) => {
                    if (!dragging) return;
                    const pt = e.touches ? e.touches[0] : e;
                    travelled = Math.max(
                        travelled,
                        Math.abs(pt.clientX - downX) +
                            Math.abs(pt.clientY - downY),
                    );
                    node.x = toWorldX(pt.clientX) - ox;
                    node.y = toWorldY(pt.clientY) - oy;
                    node.vx = 0;
                    node.vy = 0;
                    e.preventDefault();
                };
                const onUp = () => {
                    if (!dragging) return;
                    dragging = false;
                    node.pinned = false;
                    card.style.zIndex = 50;
                    // A press that barely moved is a click, not a drag.
                    if (travelled < 5) selectNode(node.id);
                };
                card.addEventListener("mousedown", onDown);
                card.addEventListener("touchstart", onDown, { passive: false });
                window.addEventListener("mousemove", onMove);
                window.addEventListener("touchmove", onMove, {
                    passive: false,
                });
                window.addEventListener("mouseup", onUp);
                window.addEventListener("touchend", onUp);

                // Hover highlight
                card.addEventListener("mouseenter", () =>
                    highlightNode(node.id),
                );
                card.addEventListener("mouseleave", () => clearHighlight());
            });

            // Highlight — hover is transient, selection sticks.
            let highlightedId = null;
            let selectedId = null;
            function highlightNode(id) {
                highlightedId = id;
                const connected = new Set([id]);
                edges.forEach((e) => {
                    if (e.from === id) connected.add(e.to);
                    if (e.to === id) connected.add(e.from);
                });
                nodes.forEach((n) => {
                    n.el.classList.toggle("dimmed", !connected.has(n.id));
                });
            }
            function clearHighlight() {
                // A selected node keeps its neighbourhood lit after the pointer leaves.
                if (selectedId) return highlightNode(selectedId);
                highlightedId = null;
                nodes.forEach((n) => {
                    if (!n.hidden) n.el.classList.remove("dimmed");
                });
            }

            // ── DETAIL PANEL ──────────────────────────────────────────────
            const detail = document.getElementById("detail");

            function neighboursOf(id) {
                return edges
                    .filter((e) => e.from === id || e.to === id)
                    .map((e) => {
                        const otherId = e.from === id ? e.to : e.from;
                        return {
                            node: nodeMap[otherId],
                            s: e.s,
                            why: e.why || "",
                            tier: e.tier || "intent",
                            out: e.from === id,
                        };
                    })
                    .sort((a, b) => b.s - a.s);
            }

            const TIER_LABEL = {
                code: "wired in code",
                spec: "in the spec",
                intent: "stated only",
                owns: "ownership",
            };

            const esc = (t) =>
                String(t).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );

            function selectNode(id) {
                const n = nodeMap[id];
                if (!n) return;
                selectedId = id;
                highlightNode(id);

                document.getElementById("dUrl").textContent = n.name;
                document.getElementById("dName").textContent = n.label;
                document.getElementById("dTagline").textContent = n.tagline;
                const visit = document.getElementById("dVisit");
                visit.href = n.url;

                const nbs = neighboursOf(id);
                document.getElementById("dCount").textContent =
                    nbs.length +
                    (nbs.length === 1 ? " connection" : " connections");
                document.getElementById("dList").innerHTML = nbs
                    .map((nb) => {
                        const col = catColors[nb.node.cat] || "#666";
                        return `
    <button class="nb" data-goto="${nb.node.id}">
      <span class="nb-top">
        <span class="nb-dot" style="background:${col}"></span>
        <span class="nb-name">${esc(nb.node.label)}</span>
        <span class="nb-dir">${nb.out ? "→" : "←"} ${nb.s.toFixed(2)}</span>
      </span>
      <span class="nb-tier t-${nb.tier}">${TIER_LABEL[nb.tier]}</span>
      <span class="nb-why">${esc(nb.why)}</span>
      <span class="nb-bar"
        ><i style="width:${Math.round(nb.s * 100)}%;background:${col}"></i
      ></span>
    </button>`;
                    })
                    .join("");
                detail.hidden = false;
                detail.scrollTop = 0;
                nodes.forEach((x) =>
                    x.el.classList.toggle("selected", x.id === id),
                );
                if (laidOut) fit();
            }

            function deselect() {
                selectedId = null;
                detail.hidden = true;
                nodes.forEach((x) => x.el.classList.remove("selected"));
                clearHighlight();
                if (laidOut) fit();
            }

            // Clicking empty space clears the selection. The canvas is
            // pointer-events:none, so a background click lands on <body>.
            window.addEventListener("mousedown", (e) => {
                if (!selectedId) return;
                if (
                    e.target.closest(
                        ".node-card, .detail, .filter-bar, .hud-top, .minimap",
                    )
                )
                    return;
                deselect();
            });

            // Jump to a neighbour from inside the panel.
            document.getElementById("dList").addEventListener("click", (e) => {
                const btn = e.target.closest("[data-goto]");
                if (!btn) return;
                const target = nodeMap[btn.dataset.goto];
                // A hidden node can't be inspected while a filter excludes it.
                if (target && target.hidden)
                    document.querySelector('[data-filter="all"]').click();
                selectNode(btn.dataset.goto);
            });
            document
                .getElementById("detailClose")
                .addEventListener("click", deselect);
            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") deselect();
            });

            // Filter
            let activeFilter = "all";
            document.querySelectorAll(".filter-btn").forEach((btn) => {
                btn.addEventListener("click", () => {
                    document
                        .querySelectorAll(".filter-btn")
                        .forEach((b) => b.classList.remove("active"));
                    btn.classList.add("active");
                    activeFilter = btn.dataset.filter;
                    nodes.forEach((n) => {
                        const show =
                            activeFilter === "all" || n.cat === activeFilter;
                        n.hidden = !show;
                        n.el.style.display = show ? "" : "none";
                        n.el.classList.remove("dimmed");
                    });
                    // Fewer cards need less room, so re-fit — filtering down to
                    // one category scales the survivors back up to readable size.
                    // This is what makes the graph usable on a phone.
                    if (laidOut) fit();
                });
            });

            // ═══════════════════════════════════════════
            // FORCE SIMULATION
            // ═══════════════════════════════════════════
            const SIM = {
                repulsion: 16000,
                attraction: 0.00035,
                edgeLen: 280,
                damping: 0.86,
                centerPull: 0.00012,
                maxSpd: 3.5,
            };

            // Chrome the cards must stay clear of: the 50px header, the filter
            // bar along the bottom, and the minimap in the bottom-right corner.
            // Without this the clamp bounds the card CENTRE, so the bottom half
            // of a ~180px card slides under the filter bar and is unreadable.
            const PAD = 10;
            // The world already excludes the header and the filter bar, so the
            // only chrome left to dodge is the minimap — converted into world
            // coordinates here. NB: .minimap is position:fixed, and a fixed
            // element always reports offsetParent === null, so visibility has to
            // be tested on the rect, not the parent.
            function chrome() {
                const mm = document.querySelector(".minimap");
                const r = mm && mm.getBoundingClientRect();
                if (!r || !r.width) return { mm: null };
                return {
                    mm: {
                        left: toWorldX(r.left),
                        right: toWorldX(r.right),
                        top: toWorldY(r.top),
                        bottom: toWorldY(r.bottom),
                    },
                };
            }

            // Cards are boxes, not points. Resolve real rectangle overlaps by
            // pushing along the axis of least penetration — point repulsion
            // alone leaves wide cards visibly stacked on each other.
            function separate(cr) {
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const a = nodes[i],
                            b = nodes[j];
                        if (a.hidden || b.hidden) continue;
                        const minX = (a.w + b.w) / 2 + PAD;
                        const minY = (a.h + b.h) / 2 + PAD;
                        const dx = b.x - a.x,
                            dy = b.y - a.y;
                        const ox = minX - Math.abs(dx),
                            oy = minY - Math.abs(dy);
                        if (ox <= 0 || oy <= 0) continue;
                        // push along whichever axis needs the smaller shove
                        if (ox < oy) {
                            const s = (dx < 0 ? -1 : 1) * ox * 0.5;
                            if (!a.pinned) a.x -= s;
                            if (!b.pinned) b.x += s;
                        } else {
                            const s = (dy < 0 ? -1 : 1) * oy * 0.5;
                            if (!a.pinned) a.y -= s;
                            if (!b.pinned) b.y += s;
                        }
                    }
                }
                nodes.forEach((n) => clampNode(n, cr));
            }

            function clampNode(n, cr) {
                const hw = n.w / 2,
                    hh = n.h / 2;
                const x0 = n.x,
                    y0 = n.y;
                n.x = Math.max(
                    hw + PAD,
                    Math.min(VIEW.worldW - hw - PAD, n.x),
                );
                n.y = Math.max(
                    hh + PAD,
                    Math.min(VIEW.worldH - hh - PAD, n.y),
                );
                // Nudge out of the minimap rather than letting a card sit under it.
                if (cr.mm) {
                    const ox =
                        Math.min(n.x + hw, cr.mm.right) -
                        Math.max(n.x - hw, cr.mm.left);
                    const oy =
                        Math.min(n.y + hh, cr.mm.bottom) -
                        Math.max(n.y - hh, cr.mm.top);
                    if (ox > 0 && oy > 0) {
                        if (ox < oy) n.x = cr.mm.left - hw - PAD;
                        else n.y = cr.mm.top - hh - PAD;
                        n.x = Math.max(hw + PAD, n.x);
                        n.y = Math.max(hh + PAD, n.y);
                    }
                }
                // Kill the velocity on any axis we had to correct. Without this
                // the force keeps pushing into the boundary, the clamp keeps
                // snapping back, and the node bounces against it forever.
                if (n.x !== x0) n.vx = 0;
                if (n.y !== y0) n.vy = 0;
            }

            // ── COOLING ──────────────────────────────────────────────────
            // The original loop integrated forces forever at a fixed damping,
            // so the layout never came to rest — it drifted indefinitely and
            // read as nodes bouncing. Forces are now scaled by a decaying
            // alpha, so the graph settles and stops; anything that changes the
            // layout re-heats it.
            let alpha = 1;
            const ALPHA_MIN = 0.004,
                ALPHA_DECAY = 0.014;
            function reheat(a = 0.6) {
                alpha = Math.max(alpha, a);
            }

            function simulate() {
                const dragging = nodes.some((n) => n.pinned);
                if (alpha < ALPHA_MIN && !dragging) return false;
                alpha = dragging
                    ? Math.max(alpha, 0.25)
                    : alpha * (1 - ALPHA_DECAY);
                nodes.forEach((n) => {
                    n.fx = 0;
                    n.fy = 0;
                });
                for (let i = 0; i < nodes.length; i++) {
                    for (let j = i + 1; j < nodes.length; j++) {
                        const a = nodes[i],
                            b = nodes[j];
                        let dx = a.x - b.x,
                            dy = a.y - b.y;
                        let d = Math.sqrt(dx * dx + dy * dy) || 1;
                        if (d > 900) continue;
                        const f = SIM.repulsion / (d * d);
                        const fx = (dx / d) * f,
                            fy = (dy / d) * f;
                        a.fx += fx;
                        a.fy += fy;
                        b.fx -= fx;
                        b.fy -= fy;
                    }
                }
                edges.forEach((e) => {
                    const a = nodeMap[e.from],
                        b = nodeMap[e.to];
                    if (!a || !b) return;
                    let dx = b.x - a.x,
                        dy = b.y - a.y,
                        d = Math.sqrt(dx * dx + dy * dy) || 1;
                    const disp = d - SIM.edgeLen;
                    const f = disp * SIM.attraction * (e.s || 0.5);
                    const fx = (dx / d) * f,
                        fy = (dy / d) * f;
                    a.fx += fx;
                    a.fy += fy;
                    b.fx -= fx;
                    b.fy -= fy;
                });
                nodes.forEach((n) => {
                    n.fx += (VIEW.worldW / 2 - n.x) * SIM.centerPull;
                    n.fy += (VIEW.worldH / 2 - n.y) * SIM.centerPull;
                });
                const cr = chrome();
                nodes.forEach((n) => {
                    if (n.pinned) return;
                    n.vx = (n.vx + n.fx * alpha) * SIM.damping;
                    n.vy = (n.vy + n.fy * alpha) * SIM.damping;
                    const spd = Math.sqrt(n.vx * n.vx + n.vy * n.vy);
                    if (spd > SIM.maxSpd) {
                        n.vx = (n.vx / spd) * SIM.maxSpd;
                        n.vy = (n.vy / spd) * SIM.maxSpd;
                    }
                    n.x += n.vx;
                    n.y += n.vy;
                    clampNode(n, cr);
                });
                separate(cr);
                return true;
            }

            // ═══════════════════════════════════════════
            // RENDER
            // ═══════════════════════════════════════════
            function drawEdges() {
                ctx.setTransform(1, 0, 0, 1, 0, 0);
                ctx.clearRect(0, 0, W, H);
                // Subtle grid — screen space, so it stays a fixed 80px lattice
                // regardless of how far the world is scaled down.
                ctx.strokeStyle = "#111325";
                ctx.lineWidth = 0.5;
                ctx.globalAlpha = 0.4;
                for (let x = 0; x < W; x += 80) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, H);
                    ctx.stroke();
                }
                for (let y = 0; y < H; y += 80) {
                    ctx.beginPath();
                    ctx.moveTo(0, y);
                    ctx.lineTo(W, y);
                    ctx.stroke();
                }
                ctx.globalAlpha = 1;

                // Everything below is world space — same transform as the cards.
                ctx.setTransform(VIEW.s, 0, 0, VIEW.s, 0, VIEW.top);

                edges.forEach((e) => {
                    const a = nodeMap[e.from],
                        b = nodeMap[e.to];
                    if (!a || !b) return;
                    if (activeFilter !== "all" && a.hidden && b.hidden) return;

                    const hl =
                        highlightedId &&
                        (e.from === highlightedId || e.to === highlightedId);
                    const alpha = hl ? 0.5 : highlightedId ? 0.03 : 0.1;
                    // divide by scale so stroke weight stays constant on screen
                    const width = (hl ? 2 : 0.7) / VIEW.s;
                    const col = catColors[a.cat] || "#444";

                    ctx.beginPath();
                    ctx.moveTo(a.x, a.y);
                    ctx.lineTo(b.x, b.y);
                    ctx.strokeStyle = col;
                    ctx.globalAlpha = alpha;
                    ctx.lineWidth = width;
                    ctx.stroke();

                    // Animated dot on highlighted edges
                    if (hl) {
                        const t = (Date.now() % 2200) / 2200;
                        const px = a.x + (b.x - a.x) * t,
                            py = a.y + (b.y - a.y) * t;
                        ctx.globalAlpha = 0.9;
                        ctx.beginPath();
                        ctx.arc(px, py, 3 / VIEW.s, 0, Math.PI * 2);
                        ctx.fillStyle = col;
                        ctx.fill();
                    }
                });
                ctx.globalAlpha = 1;
                ctx.setTransform(1, 0, 0, 1, 0, 0);
            }

            function positionCards() {
                nodes.forEach((n) => {
                    if (n.hidden) return;
                    n.el.style.left = n.x - n.w / 2 + "px";
                    n.el.style.top = n.y - n.h / 2 + "px";
                });
            }

            // Card size is CSS-driven (220px desktop, 170px under 768px) and the
            // height depends on how the tagline wraps, so measure rather than assume.
            function measureCards() {
                nodes.forEach((n) => {
                    if (!n.el) return;
                    const wasHidden = n.el.style.display === "none";
                    if (wasHidden) n.el.style.display = "";
                    n.w = n.el.offsetWidth || n.w;
                    n.h = n.el.offsetHeight || n.h;
                    if (wasHidden) n.el.style.display = "none";
                });
            }

            // Minimap
            const mmC = document.getElementById("minimap-canvas");
            const mmX = mmC.getContext("2d");
            function drawMinimap() {
                mmC.width = 140;
                mmC.height = 100;
                mmX.clearRect(0, 0, 140, 100);
                const sx = 140 / (VIEW.worldW || W),
                    sy = 100 / (VIEW.worldH || H);
                mmX.strokeStyle = "#1e2130";
                mmX.lineWidth = 0.5;
                edges.forEach((e) => {
                    const a = nodeMap[e.from],
                        b = nodeMap[e.to];
                    if (!a || !b) return;
                    mmX.beginPath();
                    mmX.moveTo(a.x * sx, a.y * sy);
                    mmX.lineTo(b.x * sx, b.y * sy);
                    mmX.stroke();
                });
                nodes.forEach((n) => {
                    mmX.fillStyle = catColors[n.cat] || "#666";
                    mmX.globalAlpha = n.hidden ? 0.1 : 0.8;
                    mmX.beginPath();
                    mmX.arc(n.x * sx, n.y * sy, 2.5, 0, Math.PI * 2);
                    mmX.fill();
                });
                mmX.globalAlpha = 1;
            }

            // Seed the ring in world coordinates once the world exists.
            function seed() {
                nodes.forEach((n, i) => {
                    const a = (i / nodes.length) * Math.PI * 2;
                    const r =
                        Math.min(VIEW.worldW, VIEW.worldH) * 0.34 + 40;
                    n.x = VIEW.worldW / 2 + Math.cos(a) * r;
                    n.y = VIEW.worldH / 2 + Math.sin(a) * r;
                    n.vx = n.vy = 0;
                });
                alpha = 1;
            }

            measureCards();
            laidOut = true;
            fit();
            seed();
            window.addEventListener("resize", () => {
                measureCards();
                fit();
            });
            // Fonts land after first paint and change how taglines wrap.
            if (document.fonts && document.fonts.ready)
                document.fonts.ready.then(() => {
                    measureCards();
                    fit();
                });

            let frame = 0;
            function loop() {
                // Re-measure periodically: fonts land late, taglines rewrap, and
                // filtering changes which cards are laid out. A stale height makes
                // the chrome clamp undershoot and a card slides under the minimap.
                if (frame % 30 === 0) measureCards();
                if (simulate()) positionCards();
                drawEdges();
                if (frame % 5 === 0) drawMinimap();
                frame++;
                requestAnimationFrame(loop);
            }
            loop();
        </script>
    </body>
</html>
